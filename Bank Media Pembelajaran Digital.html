        function filterMediaList() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const subject = document.getElementById('filterSubject').value;
            const classLevel = document.getElementById('filterClass').value;
            const type = document.getElementById('filterType').value;

            const filtered = mediaItems.filter(item => {
                const matchesSearch = item.title.toLowerCase().includes(query) || 
                                      item.description.toLowerCase().includes(query) ||
                                      item.uploader.toLowerCase().includes(query);
                const matchesSubject = !subject || item.subject === subject;
                const matchesClass = !classLevel || item.classLevel === classLevel;
                const matchesType = !type || item.type === type;
                const matchesVisibility = (currentUser.role === 'admin') || (item.status === 'Dipublikasikan');

                return matchesSearch && matchesSubject && matchesClass && matchesType && matchesVisibility;
            });

            const grid = document.getElementById('mediaGrid');
            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full py-12 text-center bg-white rounded-xl border border-slate-200">
                        <i class="fa-solid fa-folder-open text-4xl text-slate-300 mb-2"></i>

            } else {
                grid.innerHTML = filtered.map(item => renderMediaCard(item)).join('');
            }
        }

        function initUploadEvents() {
            const dropzone = document.getElementById('dropzone');
            const fileInput = document.getElementById('fileInput');

            dropzone.addEventListener('click', () => fileInput.click());
            dropzone.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropzone.classList.add('border-brand-500', 'bg-brand-50/50');
            });
            dropzone.addEventListener('dragleave', () => {
                dropzone.classList.remove('border-brand-500', 'bg-brand-50/50');
            });
            dropzone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropzone.classList.remove('border-brand-500', 'bg-brand-50/50');
                if (e.dataTransfer.files.length) {
                    fileInput.files = e.dataTransfer.files;
                    handleFileSelect(fileInput);
                }
            });
        }

        function handleFileSelect(input) {
            if (input.files && input.files[0]) {
                const file = input.files[0];
                const preview = document.getElementById('filePreview');
                preview.classList.remove('hidden');
                preview.innerHTML = `<i class="fa-solid fa-file text-brand-600"></i> ${file.name} (${(file.size / 1024 / 1024).toFixed(2)} MB)`;
            }
        }

                return;
            }

            showToast("Gemini AI sedang menyusun deskripsi...", "info");
            
            try {
                // Call Gemini API standard structure from prompt guidelines
                const promptText = `Buatkan deskripsi pembelajaran yang singkat, jelas, dan menarik untuk media berpembelajaran SD berjudul "${title}" mata pelajaran "${subject}".`;
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: promptText }] }]
                    })
                });

                const result = await response.json();
                if (result.candidates && result.candidates[0]?.content?.parts[0]?.text) {
                    document.getElementById('upDesc').value = result.candidates[0].content.parts[0].text;
                    showToast("Deskripsi AI berhasil dibuat!", "success");
                } else {
                    document.getElementById('upDesc').value = `Media pembelajaran interaktif ${title} dirancang khusus untuk mempermudah siswa memahami materi ${subject} melalui pendekatan visual intuitif.`;
                    showToast("Deskripsi templat otomatis diterapkan.", "info");
                }
            } catch (err) {
                document.getElementById('upDesc').value = `Media pembelajaran interaktif ${title} dirancang khusus untuk mempermudah pemahaman konsep siswa SD.`;
                showToast("Deskripsi bawaan diterapkan.", "info");
            }
        }

        // ==========================================
        // 4. UTILITY & EVENT INTERACTION HANDLERS
        // ==========================================

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const backdrop = document.getElementById('sidebarBackdrop');
            sidebar.classList.toggle('-translate-x-full');
            backdrop.classList.toggle('hidden');
        }

        function toggleRoleModal() {
            const modal = document.getElementById('roleModal');
            modal.classList.toggle('hidden');
        }

        function switchRole(newRole) {
            currentUser.role = newRole;
            const badge = document.getElementById('userRoleBadge');
            const name = document.getElementById('userName');
            const avatar = document.getElementById('userAvatar');
            const topAvatar = document.getElementById('topAvatar');

            if (newRole === 'admin') {
                currentUser.name = "Lenawati, S.Pd.";
                badge.innerText = "ADMIN SEKOLAH";
                avatar.innerText = "LS";
            } else if (newRole === 'guru') {
                currentUser.name = "Siti Rahmawati, S.Pd";
                badge.innerText = "GURU KONTRIBUTOR";
                avatar.innerText = "SR";
            } else if (newRole === 'kepsek') {
                currentUser.name = "Dr. H. Hendra, M.Si";
                badge.innerText = "KEPALA SEKOLAH";
                avatar.innerText = "HH";
            } else if (newRole === 'siswa') {
                currentUser.name = "Rizky Pratama (Kelas 5)";
                badge.innerText = "SISWA SD";
                avatar.innerText = "RP";
            }

            name.innerText = currentUser.name;
            topAvatar.innerText = avatar.innerText;

            toggleRoleModal();
            showToast(`Peran pengguna berhasil diubah ke ${newRole.toUpperCase()}`, "info");
            navigateTo('dashboard');
        }

        function toggleFavorite(id, e) {
            if (e) e.stopPropagation();
            const idx = userFavorites.indexOf(id);
            if (idx > -1) {
                userFavorites.splice(idx, 1);
                showToast("Dihapus dari Favorit", "info");
            } else {
                userFavorites.push(id);
                showToast("Ditambahkan ke Favorit!", "success");
            }
            navigateTo(currentActiveView);
        }

        function simulateDownload(title) {
            showToast(`Mengunduh berkas "${title}"...`, "success");
            auditLogs.unshift({
                id: "log-" + Date.now(),
                user: currentUser.name,
                action: "Mengunduh Berkas Media",
                target: title,
                timestamp: new Date().toLocaleString('id-ID')
            });
        }

        function copyShareLink(id) {
            const dummyLink = window.location.href.split('#')[0] + `?media=${id}`;
            const tempInput = document.createElement("input");
            document.body.appendChild(tempInput);
            tempInput.value = dummyLink;
            tempInput.select();
            document.execCommand("copy");
            document.body.removeChild(tempInput);
            showToast("Tautan aman berhasil disalin ke clipboard!", "success");
        }

        function toggleNotifDropdown() {
            const dd = document.getElementById('notifDropdown');
            dd.classList.toggle('hidden');
            const items = document.getElementById('notifItems');
            items.innerHTML = notifications.map(n => `
                <div class="p-3 hover:bg-slate-50 flex items-start gap-2.5 cursor-pointer">
                    <i class="fa-solid fa-circle-info text-brand-600 text-xs mt-0.5"></i>
                    <div>
                        <p class="font-semibold text-slate-800 text-[11px]">${n.title}</p>
                        <p class="text-[10px] text-slate-500">${n.desc}</p>
                        <span class="text-[9px] text-slate-400 mt-1 block">${n.time}</span>
                    </div>
                </div>
            `).join('');
        }

        function showToast(message, type = "info") {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            
            const bgMap = {
                success: 'bg-slate-900 border-emerald-500 text-white',
                info: 'bg-slate-900 border-brand-500 text-white',
                warning: 'bg-slate-900 border-amber-500 text-white'
            };

            const iconMap = {
                success: 'fa-circle-check text-emerald-400',
                info: 'fa-circle-info text-brand-400',
                warning: 'fa-triangle-exclamation text-amber-400'
            };

            toast.className = `pointer-events-auto px-4 py-3 rounded-xl border-l-4 shadow-xl ${bgMap[type]} flex items-center gap-3 text-xs font-medium transition duration-300 transform translate-y-2 opacity-0`;
            toast.innerHTML = `<i class="fa-solid ${iconMap[type]} text-sm"></i> <span>${message}</span>`;
            
            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function logout() {
            showToast("Berhasil keluar dari sistem.", "info");
        }

        function initDashboardCharts() {
            // Placeholder for optional lightweight chart initialization if needed
        }

        // Initialize Application
        window.onload = function () {
            renderNavigation();
            navigateTo('dashboard');
        }
    </script>
